
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    

    <h1>Axiom Calculator</h1>

    <div class="main-container">

        <!-- Calculator -->
        <div class="Calculator">

            <div id="display">0</div>

            <div class="buttons">
                <button>C</button>
                <button>/</button>
                <button>*</button>
                <button>-</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>+</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>=</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>0</button>

                <button>.</button>
                <button>␡</button>
                <button>±</button>
                <button>%</button>
            </div>

        </div>

        <!-- History -->
        <div class="history-panel">
            <h2>History</h2>

            <div id="history-list">
                <p>No calculations yet.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>


</body>
</html>
